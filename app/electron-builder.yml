# electron-builder config. Build on the target OS: `npm run dist:mac` on a Mac, `npm run dist:win` on Windows.
appId: app.desklist.desktop          # PLACEHOLDER: change to your reverse-DNS id
productName: Desklist
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: resources
    to: resources
asarUnpack:
  - "**/node_modules/koffi/**"
mac:
  target: [dmg, zip]                 # zip is required for electron-updater on macOS
  category: public.app-category.productivity
  icon: build/icon.png
  extendInfo:
    LSUIElement: true                # no Dock icon (menu-bar/tray app)
  # Signing/notarization needs an Apple Developer account:
  #   export CSC_LINK=... CSC_KEY_PASSWORD=... APPLE_ID=... APPLE_APP_SPECIFIC_PASSWORD=... APPLE_TEAM_ID=...
  hardenedRuntime: true
  notarize: false                    # set true once Apple credentials are configured
win:
  target: [nsis]
  icon: build/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
publish:
  provider: github
  owner: YOUR_GITHUB_OWNER           # PLACEHOLDER — GitHub user/org that hosts releases
  repo: YOUR_GITHUB_REPO             # PLACEHOLDER — repository name
  releaseType: release
